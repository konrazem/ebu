{
  "schemaVersion": "2.2",
  "description": "EBU AWS-C0 synthetic-only exact-version request preparation and bounded no-block systemd handoff. This document does not install software or keep SSM attached to the attempt.",
  "parameters": {
    "ArtifactBucket": {
      "type": "String",
      "allowedPattern": "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$",
      "interpolationType": "ENV_VAR"
    },
    "LaunchRequestKey": {
      "type": "String",
      "allowedPattern": "^rehearsal/aws-c0/AWS-C0-[A-Z0-9-]{1,64}/ATTEMPT-[A-Z0-9-]{1,64}-(SUCCESS|FAIL-AFTER-CHECKPOINT|TIMEOUT)/launch-request\\.json$",
      "interpolationType": "ENV_VAR"
    },
    "LaunchRequestVersionId": {
      "type": "String",
      "allowedPattern": "^[A-Za-z0-9._+~=/:-]{1,1024}$",
      "interpolationType": "ENV_VAR"
    },
    "LaunchRequestSha256": {
      "type": "String",
      "allowedPattern": "^[0-9a-f]{64}$",
      "interpolationType": "ENV_VAR"
    },
    "LaunchRequestBytes": {
      "type": "String",
      "allowedPattern": "^[1-9][0-9]{0,9}$",
      "interpolationType": "ENV_VAR"
    },
    "LivePacketKey": {
      "type": "String",
      "allowedPattern": "^rehearsal/aws-c0/AWS-C0-[A-Z0-9-]{1,64}/ATTEMPT-[A-Z0-9-]{1,64}-(SUCCESS|FAIL-AFTER-CHECKPOINT|TIMEOUT)/live-packet\\.json$",
      "interpolationType": "ENV_VAR"
    },
    "LivePacketVersionId": {
      "type": "String",
      "allowedPattern": "^[A-Za-z0-9._+~=/:-]{1,1024}$",
      "interpolationType": "ENV_VAR"
    },
    "LivePacketSha256": {
      "type": "String",
      "allowedPattern": "^[0-9a-f]{64}$",
      "interpolationType": "ENV_VAR"
    },
    "LivePacketBytes": {
      "type": "String",
      "allowedPattern": "^[1-9][0-9]{0,9}$",
      "interpolationType": "ENV_VAR"
    },
    "LiveAuthorizationKey": {
      "type": "String",
      "allowedPattern": "^rehearsal/aws-c0/AWS-C0-[A-Z0-9-]{1,64}/ATTEMPT-[A-Z0-9-]{1,64}-(SUCCESS|FAIL-AFTER-CHECKPOINT|TIMEOUT)/live-authorization\\.json$",
      "interpolationType": "ENV_VAR"
    },
    "LiveAuthorizationVersionId": {
      "type": "String",
      "allowedPattern": "^[A-Za-z0-9._+~=/:-]{1,1024}$",
      "interpolationType": "ENV_VAR"
    },
    "LiveAuthorizationSha256": {
      "type": "String",
      "allowedPattern": "^[0-9a-f]{64}$",
      "interpolationType": "ENV_VAR"
    },
    "LiveAuthorizationBytes": {
      "type": "String",
      "allowedPattern": "^[1-9][0-9]{0,9}$",
      "interpolationType": "ENV_VAR"
    },
    "RehearsalId": {
      "type": "String",
      "allowedPattern": "^AWS-C0-[A-Z0-9-]{1,64}$",
      "interpolationType": "ENV_VAR"
    },
    "AttemptId": {
      "type": "String",
      "allowedPattern": "^ATTEMPT-[A-Z0-9-]{1,64}-(SUCCESS|FAIL-AFTER-CHECKPOINT|TIMEOUT)$",
      "interpolationType": "ENV_VAR"
    },
    "WorkflowExecutionArn": {
      "type": "String",
      "allowedPattern": "^arn:aws:states:us-east-1:[0-9]{12}:execution:[A-Za-z0-9+=,.@_-]{1,80}:[A-Za-z0-9+=,.@_-]{1,80}$",
      "interpolationType": "ENV_VAR"
    },
    "Region": {
      "type": "String",
      "allowedValues": [
        "us-east-1"
      ],
      "interpolationType": "ENV_VAR"
    },
    "ArtifactPrefix": {"type": "String", "allowedPattern": "^rehearsal/aws-c0/AWS-C0-[A-Z0-9-]{1,64}/ATTEMPT-[A-Z0-9-]{1,64}-(SUCCESS|FAIL-AFTER-CHECKPOINT|TIMEOUT)/$", "interpolationType": "ENV_VAR"},
    "SsmClientRequestToken": {"type": "String", "allowedPattern": "^[A-Za-z0-9_-]{8,64}$", "interpolationType": "ENV_VAR"},
    "SsmExpectedCommandNotBeforeUtc": {"type": "String", "allowedPattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$", "interpolationType": "ENV_VAR"},
    "SsmExpectedCommandNotAfterUtc": {"type": "String", "allowedPattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$", "interpolationType": "ENV_VAR"},
    "SsmDispatchRequestCanonicalJsonBase64": {"type": "String", "allowedPattern": "^[A-Za-z0-9+/]+={0,2}$", "interpolationType": "ENV_VAR"},
    "SsmDispatchRequestSha256": {"type": "String", "allowedPattern": "^[0-9a-f]{64}$", "interpolationType": "ENV_VAR"}
  },
  "mainSteps": [
    {
      "action": "aws:runShellScript",
      "name": "PrepareAndStartBoundedController",
      "precondition": {
        "StringEquals": [
          "platformType",
          "Linux"
        ]
      },
      "inputs": {
        "timeoutSeconds": "120",
        "runCommand": [
          "set -eu",
          "umask 077",
          "/usr/bin/test \"$(/usr/bin/id -u)\" -eq 0",
          "/usr/bin/printf '%s\\n' \"${SSM_ArtifactBucket-}\" | /usr/bin/grep -Eq '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'",
          "/usr/bin/printf '%s\\n' \"${SSM_LaunchRequestKey-}\" | /usr/bin/grep -Eq '^rehearsal/aws-c0/AWS-C0-[A-Z0-9-]{1,64}/ATTEMPT-[A-Z0-9-]{1,64}-(SUCCESS|FAIL-AFTER-CHECKPOINT|TIMEOUT)/launch-request\\.json$'",
          "/usr/bin/printf '%s\\n' \"${SSM_LaunchRequestVersionId-}\" | /usr/bin/grep -Eq '^[A-Za-z0-9._+~=/:-]{1,1024}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_LaunchRequestSha256-}\" | /usr/bin/grep -Eq '^[0-9a-f]{64}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_LivePacketKey-}\" | /usr/bin/grep -Eq '^rehearsal/aws-c0/AWS-C0-[A-Z0-9-]{1,64}/ATTEMPT-[A-Z0-9-]{1,64}-(SUCCESS|FAIL-AFTER-CHECKPOINT|TIMEOUT)/live-packet\\.json$'",
          "/usr/bin/printf '%s\\n' \"${SSM_LivePacketVersionId-}\" | /usr/bin/grep -Eq '^[A-Za-z0-9._+~=/:-]{1,1024}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_LivePacketSha256-}\" | /usr/bin/grep -Eq '^[0-9a-f]{64}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_LaunchRequestBytes-}\" | /usr/bin/grep -Eq '^[1-9][0-9]{0,9}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_LivePacketBytes-}\" | /usr/bin/grep -Eq '^[1-9][0-9]{0,9}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_LiveAuthorizationKey-}\" | /usr/bin/grep -Eq '^rehearsal/aws-c0/AWS-C0-[A-Z0-9-]{1,64}/ATTEMPT-[A-Z0-9-]{1,64}-(SUCCESS|FAIL-AFTER-CHECKPOINT|TIMEOUT)/live-authorization\\.json$'",
          "/usr/bin/printf '%s\\n' \"${SSM_LiveAuthorizationVersionId-}\" | /usr/bin/grep -Eq '^[A-Za-z0-9._+~=/:-]{1,1024}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_LiveAuthorizationBytes-}\" | /usr/bin/grep -Eq '^[1-9][0-9]{0,9}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_LiveAuthorizationSha256-}\" | /usr/bin/grep -Eq '^[0-9a-f]{64}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_RehearsalId-}\" | /usr/bin/grep -Eq '^AWS-C0-[A-Z0-9-]{1,64}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_AttemptId-}\" | /usr/bin/grep -Eq '^ATTEMPT-[A-Z0-9-]{1,64}-(SUCCESS|FAIL-AFTER-CHECKPOINT|TIMEOUT)$'",
          "/usr/bin/printf '%s\\n' \"${SSM_WorkflowExecutionArn-}\" | /usr/bin/grep -Eq '^arn:aws:states:us-east-1:[0-9]{12}:execution:[A-Za-z0-9+=,.@_-]{1,80}:[A-Za-z0-9+=,.@_-]{1,80}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_ArtifactPrefix-}\" | /usr/bin/grep -Eq '^rehearsal/aws-c0/AWS-C0-[A-Z0-9-]{1,64}/ATTEMPT-[A-Z0-9-]{1,64}-(SUCCESS|FAIL-AFTER-CHECKPOINT|TIMEOUT)/$'",
          "/usr/bin/printf '%s\\n' \"${SSM_SsmClientRequestToken-}\" | /usr/bin/grep -Eq '^[A-Za-z0-9_-]{8,64}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_SsmExpectedCommandNotBeforeUtc-}\" | /usr/bin/grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'",
          "/usr/bin/printf '%s\\n' \"${SSM_SsmExpectedCommandNotAfterUtc-}\" | /usr/bin/grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'",
          "/usr/bin/printf '%s\\n' \"${SSM_SsmDispatchRequestCanonicalJsonBase64-}\" | /usr/bin/grep -Eq '^[A-Za-z0-9+/]+={0,2}$'",
          "/usr/bin/printf '%s\\n' \"${SSM_SsmDispatchRequestSha256-}\" | /usr/bin/grep -Eq '^[0-9a-f]{64}$'",
          "/usr/bin/test \"${SSM_Region-}\" = 'us-east-1'",
          "/usr/bin/test \"${SSM_LaunchRequestKey-}\" = \"rehearsal/aws-c0/${SSM_RehearsalId}/${SSM_AttemptId}/launch-request.json\"",
          "/usr/bin/test \"${SSM_LivePacketKey-}\" = \"rehearsal/aws-c0/${SSM_RehearsalId}/${SSM_AttemptId}/live-packet.json\"",
          "/usr/bin/test \"${SSM_LiveAuthorizationKey-}\" = \"rehearsal/aws-c0/${SSM_RehearsalId}/${SSM_AttemptId}/live-authorization.json\"",
          "/usr/bin/test -x /usr/local/libexec/ebu-c0/ebu_c0_controller.py",
          "/usr/bin/test ! -L /usr/local/libexec/ebu-c0/ebu_c0_controller.py",
          "/usr/bin/test -f /etc/systemd/system/ebu-c0@.service",
          "/usr/bin/test ! -L /etc/systemd/system/ebu-c0@.service",
          "/usr/bin/install -d -o root -g root -m 0700 /var/lib/ebu-c0/requests",
          "request_file=\"/var/lib/ebu-c0/requests/${SSM_AttemptId}.json\"",
          "source_file=\"/var/lib/ebu-c0/requests/${SSM_AttemptId}.source.json\"",
          "/usr/bin/test ! -e \"$request_file\"",
          "/usr/bin/test ! -L \"$request_file\"",
          "/usr/bin/test ! -e \"$source_file\"",
          "/usr/bin/test ! -L \"$source_file\"",
          "/usr/bin/python3 /usr/local/libexec/ebu-c0/ebu_c0_controller.py prepare-request-v4 --region=us-east-1 --bucket=\"$SSM_ArtifactBucket\" --artifact-prefix=\"$SSM_ArtifactPrefix\" --launch-key=\"$SSM_LaunchRequestKey\" --launch-version-id=\"$SSM_LaunchRequestVersionId\" --launch-sha256=\"$SSM_LaunchRequestSha256\" --launch-bytes=\"$SSM_LaunchRequestBytes\" --live-packet-key=\"$SSM_LivePacketKey\" --live-packet-version-id=\"$SSM_LivePacketVersionId\" --live-packet-sha256=\"$SSM_LivePacketSha256\" --live-packet-bytes=\"$SSM_LivePacketBytes\" --live-authorization-key=\"$SSM_LiveAuthorizationKey\" --live-authorization-version-id=\"$SSM_LiveAuthorizationVersionId\" --live-authorization-sha256=\"$SSM_LiveAuthorizationSha256\" --live-authorization-bytes=\"$SSM_LiveAuthorizationBytes\" --workflow-execution-arn=\"$SSM_WorkflowExecutionArn\" --ssm-client-request-token=\"$SSM_SsmClientRequestToken\" --ssm-expected-command-not-before-utc=\"$SSM_SsmExpectedCommandNotBeforeUtc\" --ssm-expected-command-not-after-utc=\"$SSM_SsmExpectedCommandNotAfterUtc\" --ssm-dispatch-request-canonical-json-base64=\"$SSM_SsmDispatchRequestCanonicalJsonBase64\" --ssm-dispatch-request-sha256=\"$SSM_SsmDispatchRequestSha256\" --rehearsal-id=\"$SSM_RehearsalId\" --attempt-id=\"$SSM_AttemptId\" --output=\"$request_file\"",
          "/usr/bin/test \"$(/usr/bin/stat -c '%u:%g:%a' \"$request_file\")\" = '0:0:600'",
          "/usr/bin/test \"$(/usr/bin/stat -c '%u:%g:%a' \"$source_file\")\" = '0:0:600'",
          "/usr/bin/systemctl start --no-block \"ebu-c0@${SSM_AttemptId}.service\""
        ]
      }
    }
  ]
}
