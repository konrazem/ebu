                  "/usr/bin/python3 /usr/local/libexec/ebu-c0/ebu_c0_controller.py prepare-request-v4 --bucket=\"$SSM_ArtifactBucket\" --artifact-prefix=\"$SSM_ArtifactPrefix\" --launch-key=\"$SSM_LaunchRequestKey\" --launch-version-id=\"$SSM_LaunchRequestVersionId\" --launch-sha256=\"$SSM_LaunchRequestSha256\" --launch-bytes=\"$SSM_LaunchRequestBytes\" --live-packet-key=\"$SSM_LivePacketKey\" --live-packet-version-id=\"$SSM_LivePacketVersionId\" --live-packet-sha256=\"$SSM_LivePacketSha256\" --live-packet-bytes=\"$SSM_LivePacketBytes\" --live-authorization-key=\"$SSM_LiveAuthorizationKey\" --live-authorization-version-id=\"$SSM_LiveAuthorizationVersionId\" --live-authorization-sha256=\"$SSM_LiveAuthorizationSha256\" --live-authorization-bytes=\"$SSM_LiveAuthorizationBytes\" --workflow-execution-arn=\"$SSM_WorkflowExecutionArn\" --ssm-client-request-token=\"$SSM_SsmClientRequestToken\" --ssm-expected-command-not-before-utc=\"$SSM_SsmExpectedCommandNotBeforeUtc\" --ssm-expected-command-not-after-utc=\"$SSM_SsmExpectedCommandNotAfterUtc\" --ssm-dispatch-request-base64=\"$SSM_SsmDispatchRequestBase64\" --ssm-dispatch-request-sha256=\"$SSM_SsmDispatchRequestSha256\" --rehearsal-id=\"$SSM_RehearsalId\" --attempt-id=\"$SSM_AttemptId\" --output=\"$request_file\"",
                  "/usr/bin/test \"$(/usr/bin/stat -c '%u:%g:%a' \"$request_file\")\" = '0:0:600'",
                  "/usr/bin/test \"$(/usr/bin/stat -c '%u:%g:%a' \"$source_file\")\" = '0:0:600'",
                  "/usr/bin/systemctl start --no-block \"ebu-c0@${SSM_AttemptId}.service\""
                ]
              }
            }
          ]
        }
      }
    },
    "StepFunctionsRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": "EBU-C0-Corrected-StepFunctions-v1",
        "PermissionsBoundary": {
          "Fn::If": [
            "HasBoundary",
