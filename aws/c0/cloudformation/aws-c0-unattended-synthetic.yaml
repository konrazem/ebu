                        "Arn"
                      ]
                    },
                    {
                      "Fn::GetAtt": [
                        "FinalizerLogGroup",
                        "Arn"
                      ]
                    }
                  ]
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "ebu:authority",
            "Value": "AWS-C0"
          },
          {
            "Key": "ebu:payload",
            "Value": "synthetic-only"
          }
        ]
