        "Policies": [
          {
            "PolicyName": "ExactPacketAndClosure",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "BucketControls",
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetBucketLocation",
                    "s3:GetBucketVersioning",
                    "s3:GetEncryptionConfiguration",
                    "s3:GetBucketPublicAccessBlock",
                    "s3:GetBucketPolicy",
                    "s3:GetBucketPolicyStatus"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:aws:s3:::${ArtifactBucketName}"
