    "FinalizerRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": "EBU-C0-Corrected-Finalizer-v1",
        "PermissionsBoundary": {
          "Fn::If": [
            "HasBoundary",
            {
              "Ref": "PermissionsBoundaryArn"
            },
            {
              "Ref": "AWS::NoValue"
