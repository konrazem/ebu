                    "s3:ListBucket",
                    "s3:ListBucketVersions"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:aws:s3:::${ArtifactBucketName}"
                  },
                  "Condition": {
                    "StringLike": {
                      "s3:prefix": [
