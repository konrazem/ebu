<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" role="img" aria-labelledby="title desc">
  <title id="title">Four payment topologies using the same five participants</title>
  <desc id="desc">A line has four edges and needs up to four handoffs. A star has four edges and needs at most two, but relies on its centre. A ring has five edges and survives any single edge loss. A complete graph has ten edges and permits every payment directly. Lines permit payment both ways, and crossings without circles are not nodes.</desc>
  <rect width="1100" height="840" fill="#fff"/>
  <style>text{font-family:Arial,sans-serif;fill:#172b40}.edge{stroke:#6c8cac;stroke-width:2.5;fill:none}.node{fill:#eef5fb;stroke:#2563a6;stroke-width:2}.label{font-size:19px;text-anchor:middle;dominant-baseline:middle}.heading{font-size:25px;font-weight:bold}.note{font-size:19px}</style>
  <text x="35" y="45" font-size="28" font-weight="bold">Same cells and holdings; different payment possibilities</text>
  <text x="35" y="80" font-size="20">Every line allows existing EBU to pass in either direction.</text>
  <path d="M550 120V745M35 430H1065" stroke="#d6e1ec" stroke-width="1"/>
  <text class="heading" x="40" y="150">Line</text>
  <g class="edge"><path d="M80 260H470"/></g>
  <g class="node"><circle cx="80" cy="260" r="24"/><circle cx="178" cy="260" r="24"/><circle cx="275" cy="260" r="24"/><circle cx="373" cy="260" r="24"/><circle cx="470" cy="260" r="24"/></g>
  <g class="label"><text x="80" y="261">A</text><text x="178" y="261">B</text><text x="275" y="261">C</text><text x="373" y="261">D</text><text x="470" y="261">E</text></g>
  <text class="note" x="40" y="365">4 links · up to 4 handoffs</text><text class="note" x="40" y="397">Any lost link separates the group.</text>
  <text class="heading" x="590" y="150">Star</text>
  <g class="edge"><path d="M825 260L680 205M825 260L970 205M825 260L680 315M825 260L970 315"/></g>
  <g class="node"><circle cx="825" cy="260" r="24"/><circle cx="680" cy="205" r="24"/><circle cx="970" cy="205" r="24"/><circle cx="680" cy="315" r="24"/><circle cx="970" cy="315" r="24"/></g>
  <g class="label"><text x="825" y="261">A</text><text x="680" y="206">B</text><text x="970" y="206">C</text><text x="680" y="316">D</text><text x="970" y="316">E</text></g>
  <text class="note" x="590" y="365">4 links · up to 2 handoffs</text><text class="note" x="590" y="397">Outer-to-outer payments use A.</text>
  <text class="heading" x="40" y="478">Ring</text>
  <g class="edge"><path d="M275 520L410 580L360 680L190 680L140 580Z"/></g>
  <g class="node"><circle cx="275" cy="520" r="23"/><circle cx="410" cy="580" r="23"/><circle cx="360" cy="680" r="23"/><circle cx="190" cy="680" r="23"/><circle cx="140" cy="580" r="23"/></g>
  <g class="label"><text x="275" y="521">A</text><text x="410" y="581">B</text><text x="360" y="681">C</text><text x="190" y="681">D</text><text x="140" y="581">E</text></g>
  <text class="note" x="40" y="739">5 links · survives any single link loss</text>
  <text class="heading" x="590" y="478">Complete</text>
  <g class="edge"><path d="M825 520L960 580L910 680L740 680L690 580Z"/><path d="M825 520L910 680M825 520L740 680M960 580L740 680M960 580L690 580M910 680L690 580"/></g>
  <g class="node"><circle cx="825" cy="520" r="23"/><circle cx="960" cy="580" r="23"/><circle cx="910" cy="680" r="23"/><circle cx="740" cy="680" r="23"/><circle cx="690" cy="580" r="23"/></g>
  <g class="label"><text x="825" y="521">A</text><text x="960" y="581">B</text><text x="910" y="681">C</text><text x="740" y="681">D</text><text x="690" y="581">E</text></g>
  <text class="note" x="590" y="739">10 links · every payment is direct</text>
  <text x="550" y="802" text-anchor="middle" font-size="19">Only circles are nodes. Crossing lines do not create another participant.</text>
</svg>
