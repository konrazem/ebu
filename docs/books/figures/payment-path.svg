<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
  <title id="title">The same 5 EBU travels from A through B to C</title>
  <desc id="desc">Three cell-associated participants. A starts with 12 EBU, B with 3, C with 0. A sends 5 to B, then B forwards 5 to C. Final balances are 7, 3, and 5. All cell amounts and fields remain unchanged.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563a6"/></marker></defs>
  <rect width="1100" height="410" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172b40">
    <text x="40" y="47" font-size="28" font-weight="bold">One payment, forwarded once</text>
    <text x="40" y="82" font-size="20">Arrows move existing EBU. They do not move physical resource.</text>
    <g fill="#eef5fb" stroke="#7e9bb7" stroke-width="2">
      <rect x="40" y="135" width="240" height="170" rx="12"/>
      <rect x="430" y="135" width="240" height="170" rx="12"/>
      <rect x="820" y="135" width="240" height="170" rx="12"/>
    </g>
    <g text-anchor="middle">
      <text x="160" y="178" font-size="25" font-weight="bold">Cell A participant</text>
      <text x="550" y="178" font-size="25" font-weight="bold">Cell B participant</text>
      <text x="940" y="178" font-size="25" font-weight="bold">Cell C participant</text>
      <text x="160" y="226" font-size="24">12 → 7 EBU</text>
      <text x="550" y="226" font-size="24">3 → 8 → 3 EBU</text>
      <text x="940" y="226" font-size="24">0 → 5 EBU</text>
      <text x="160" y="270" font-size="19">Field unchanged</text>
      <text x="550" y="270" font-size="19">Field unchanged</text>
      <text x="940" y="270" font-size="19">Field unchanged</text>
      <text x="355" y="164" font-size="19">1. Send 5</text>
      <text x="745" y="164" font-size="19">2. Forward 5</text>
    </g>
    <g stroke="#2563a6" stroke-width="3" marker-end="url(#arrow)"><path d="M290 210H415"/><path d="M680 210H805"/></g>
    <text x="550" y="365" text-anchor="middle" font-size="23">Total: 15 EBU before, during, and after. No new EBU is created.</text>
  </g>
</svg>
